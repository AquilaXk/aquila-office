[package]
name = "aquila-office-desktop"
version = "0.1.0"
description = "Aquila Office Desktop Shell"
authors = ["Aquila Team"]
edition = "2021"

[lib]
name = "aquila_office_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
