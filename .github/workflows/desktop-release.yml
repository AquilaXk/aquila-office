name: Desktop Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.1.0)"
        required: true
        default: "0.1.0"
      publish:
        description: "Publish the GitHub Release (false builds and uploads workflow artifacts only)"
        type: boolean
        required: false
        default: true
      release_draft:
        description: "Create the release as a draft"
        type: boolean
        required: false
        default: false

concurrency:
  group: desktop-release-${{ github.event_name == 'workflow_dispatch' && format('dispatch-{0}-{1}-{2}', inputs.version, inputs.publish, inputs.release_draft) || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Validate Release Metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      draft: ${{ steps.meta.outputs.draft }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve version, tag, and verify aligned manifests
        id: meta
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_DRAFT: ${{ inputs.release_draft }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${INPUT_VERSION#v}"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release version must follow SemVer (e.g. 0.1.0)"
            exit 1
          fi

          DRAFT=false
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$INPUT_DRAFT" = "true" ]; then
            DRAFT=true
          fi

          PKG_VERSION="$(node -e "console.log(JSON.parse(require('fs').readFileSync('front/package.json','utf8')).version)")"
          TAURI_VERSION="$(node -e "console.log(JSON.parse(require('fs').readFileSync('front/src-tauri/tauri.conf.json','utf8')).version)")"
          CARGO_VERSION="$(awk '/^\[package\]/{in_pkg=1; next} /^\[/{in_pkg=0} in_pkg && /^version[[:space:]]*=/{gsub(/.*=[[:space:]]*"|".*/, ""); print; exit}' front/src-tauri/Cargo.toml)"
          GRADLE_VERSION="$(awk '/^version[[:space:]]*=/{gsub(/.*=[[:space:]]*"|".*/, ""); print; exit}' back/build.gradle.kts)"

          for manifest in "front/package.json:$PKG_VERSION" "front/src-tauri/tauri.conf.json:$TAURI_VERSION" "front/src-tauri/Cargo.toml:$CARGO_VERSION" "back/build.gradle.kts:$GRADLE_VERSION"; do
            name="${manifest%%:*}"
            actual="${manifest#*:}"
            if [ "$actual" != "$VERSION" ]; then
              echo "::error::Version mismatch in $name: expected $VERSION, found $actual"
              exit 1
            fi
          done

          {
            echo "version=$VERSION"
            echo "tag=v$VERSION"
            echo "draft=$DRAFT"
          } >> "$GITHUB_OUTPUT"

  release-macos:
    name: Build macOS Universal (.dmg)
    needs: prepare
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "front/package-lock.json"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: front/src-tauri
          key: macos-universal

      - name: Install frontend dependencies
        run: npm --prefix front ci

      - name: Build macOS universal desktop bundle
        working-directory: front
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY || '-' }}
          BUILD_TARGET: "desktop"
        run: |
          set -euo pipefail
          BUNDLES="$(node ../tools/release/release-assets.mjs bundles macos-universal)"
          npx --yes @tauri-apps/cli@^2 build --ci --target universal-apple-darwin --bundles "$BUNDLES"

      - name: Verify bundled license notices
        run: |
          RES="front/src-tauri/target/universal-apple-darwin/release/bundle/macos/Aquila Office.app/Contents/Resources"
          test -f "$RES/LICENSE"
          test -f "$RES/NOTICE"
          test -f "$RES/THIRD_PARTY_NOTICES.md"

      - name: Stage macOS release asset
        run: node tools/release/release-assets.mjs stage macos-universal dist

      - name: Upload macOS release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-universal
          path: dist/
          retention-days: 14
          if-no-files-found: error

  release-windows:
    name: Build Windows x64 Installer (.exe)
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "front/package-lock.json"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: front/src-tauri
          key: windows-x64

      - name: Install frontend dependencies
        run: npm --prefix front ci

      - name: Build Windows x64 NSIS installer
        working-directory: front
        shell: bash
        env:
          BUILD_TARGET: "desktop"
        run: |
          set -euo pipefail
          BUNDLES="$(node ../tools/release/release-assets.mjs bundles windows-x64)"
          npx --yes @tauri-apps/cli@^2 build --ci --bundles "$BUNDLES"

      - name: Verify bundled license notices inside NSIS installer
        shell: bash
        run: |
          set -euo pipefail
          LISTING="$(7z l front/src-tauri/target/release/bundle/nsis/*-setup.exe)"
          for file in LICENSE NOTICE THIRD_PARTY_NOTICES.md; do
            grep -qF "$file" <<<"$LISTING" || { echo "::error::$file missing from NSIS installer"; exit 1; }
          done

      - name: Stage Windows release asset
        shell: bash
        run: node tools/release/release-assets.mjs stage windows-x64 dist

      - name: Upload Windows release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-x64
          path: dist/
          retention-days: 14
          if-no-files-found: error

  release-linux:
    name: Build Linux (${{ matrix.platform }}) Packages
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-22.04
          - platform: linux-arm64
            runner: ubuntu-22.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        uses: ./.github/actions/install-linux-deps

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "front/package-lock.json"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: front/src-tauri
          key: ${{ matrix.platform }}

      - name: Install frontend dependencies
        run: npm --prefix front ci

      - name: Build Linux desktop packages
        working-directory: front
        env:
          BUILD_TARGET: "desktop"
          APPIMAGE_EXTRACT_AND_RUN: "1"
          NO_STRIP: "true"
        run: |
          set -euo pipefail
          BUNDLES="$(node ../tools/release/release-assets.mjs bundles "${{ matrix.platform }}")"
          npx --yes @tauri-apps/cli@^2 build --ci --bundles "$BUNDLES"

      - name: Verify bundled license notices inside deb package
        run: |
          set -euo pipefail
          DEB_PATH="$(find front/src-tauri/target/release/bundle/deb -maxdepth 1 -name '*.deb' -print -quit)"
          [[ -n "$DEB_PATH" ]] || { echo "::error::No .deb bundle found"; exit 1; }
          LISTING="$(dpkg-deb -c "$DEB_PATH")"
          for file in LICENSE NOTICE THIRD_PARTY_NOTICES.md; do
            grep -qF "$file" <<<"$LISTING" || { echo "::error::$file missing from $DEB_PATH"; exit 1; }
          done

      - name: Stage Linux release assets
        run: node tools/release/release-assets.mjs stage "${{ matrix.platform }}" dist

      - name: Upload Linux release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: dist/
          retention-days: 14
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: [prepare, release-macos, release-windows, release-linux]
    if: github.event_name != 'workflow_dispatch' || inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download built platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: release-*
          merge-multiple: true

      - name: Generate combined SHA256SUMS.txt
        run: node tools/release/release-assets.mjs checksums release-assets

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          DRAFT: ${{ needs.prepare.outputs.draft }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          FILES=(release-assets/*)
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --title "Aquila Office ${TAG}" --draft="$DRAFT" --repo "$GITHUB_REPOSITORY"
          else
            FLAGS=(--target "$TARGET_SHA" --title "Aquila Office ${TAG}" --generate-notes --repo "$GITHUB_REPOSITORY")
            if [ "$DRAFT" = "true" ]; then
              FLAGS+=(--draft)
            fi
            gh release create "$TAG" "${FILES[@]}" "${FLAGS[@]}"
          fi
