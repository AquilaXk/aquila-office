name: CI

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/**"
      - ".gitignore"
      - "CONTRIBUTING.md"
      - "LICENSE"
      - "NOTICE"
      - "README.md"
      - "SECURITY.md"
      - "THIRD_PARTY_NOTICES.md"
      - "TODO.md"
      - "back/**"
      - "compose.dev.yml"
      - "compose.prod.yml"
      - "docker/**"
      - "front/**"
      - "infra/**"
      - "perf/**"
      - "scripts/deploy/**"
      - "tools/ci/**"
      - "tools/readme/**"
      - "tools/release/**"
      - "tools/test/**"
      - "tools/perf/**"
  push:
    branches: ["main"]
    paths:
      - ".github/**"
      - ".gitignore"
      - "CONTRIBUTING.md"
      - "LICENSE"
      - "NOTICE"
      - "README.md"
      - "SECURITY.md"
      - "THIRD_PARTY_NOTICES.md"
      - "TODO.md"
      - "back/**"
      - "compose.dev.yml"
      - "compose.prod.yml"
      - "docker/**"
      - "front/**"
      - "infra/**"
      - "perf/**"
      - "scripts/deploy/**"
      - "tools/ci/**"
      - "tools/readme/**"
      - "tools/release/**"
      - "tools/test/**"
      - "tools/perf/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Resolve Changed Files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.gates.outputs.backend }}
      desktop: ${{ steps.gates.outputs.desktop }}
      docs: ${{ steps.gates.outputs.docs }}
      frontend: ${{ steps.gates.outputs.frontend }}
      infra: ${{ steps.gates.outputs.infra }}
      smoke: ${{ steps.gates.outputs.smoke }}
      workflow: ${{ steps.gates.outputs.workflow }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve changed files
        id: files
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          : > changed-files.txt
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --name-only "$PR_BASE_SHA" "$PR_HEAD_SHA" > changed-files.txt
          elif [[ "$EVENT_NAME" == "push" ]]; then
            if [[ "$PUSH_BEFORE" =~ ^0+$ ]] || ! git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
              git ls-files > changed-files.txt
              echo "run_all=true" >> "$GITHUB_OUTPUT"
            else
              git diff --name-only "$PUSH_BEFORE" "$CURRENT_SHA" > changed-files.txt
            fi
          else
            git ls-files > changed-files.txt
            echo "run_all=true" >> "$GITHUB_OUTPUT"
          fi

          {
            echo "### Changed files"
            echo ""
            head -n 50 changed-files.txt | sed 's/^/- `/' | sed 's/$/`/'
            total_changed="$(wc -l < changed-files.txt)"
            if (( total_changed > 50 )); then
              echo "- ... and $((total_changed - 50)) more files"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve CI gates
        id: gates
        shell: bash
        env:
          RUN_ALL: ${{ steps.files.outputs.run_all }}
        run: |
          set -euo pipefail

          args=(--files=changed-files.txt)
          if [[ "$RUN_ALL" == "true" ]]; then
            args+=(--all)
          fi

          node tools/ci/resolve-ci-gates.mjs "${args[@]}" | tee ci-gates.env
          cat ci-gates.env >> "$GITHUB_OUTPUT"

          {
            echo ""
            echo "### CI gates"
            echo ""
            echo "| gate | enabled |"
            echo "| --- | --- |"
            sed 's/=/ | /; s/^/| /; s/$/ |/' ci-gates.env
          } >> "$GITHUB_STEP_SUMMARY"

  hygiene:
    name: Repository & Code Health Gate
    runs-on: ubuntu-latest
    needs: changes
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Run repository hygiene and code health guard
        run: node tools/ci/check-repo-hygiene.mjs

  docs:
    name: README Documentation Gate
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validate README contract
        run: node tools/readme/validate-readme.mjs

      - name: Run repository hygiene guard
        run: node tools/ci/check-repo-hygiene.mjs

  backend:
    name: Backend Quality Gate
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Grant Gradle wrapper permission
        run: chmod +x back/gradlew

      - name: Run backend quality gate
        run: ./back/gradlew -p back check

      - name: Upload backend check reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-check-reports
          path: |
            back/build/reports/tests/test/
            back/build/reports/checkstyle/
            back/build/reports/spotbugs/
            back/build/reports/jacoco/test/
            back/build/reports/problems/
          if-no-files-found: ignore
          retention-days: 14

  frontend:
    name: Frontend Quality Gate
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Install dependencies
        working-directory: front
        run: npm ci

      - name: Run frontend lint
        working-directory: front
        run: npm run lint

      - name: Run frontend node tests
        working-directory: front
        run: npm run test:node

      - name: Run desktop static export build
        working-directory: front
        run: npm run build:desktop

      - name: Run frontend build
        working-directory: front
        run: npm run build

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('front/package-lock.json') }}

      - name: Install frontend browser dependencies
        working-directory: front
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" != "true" ]; then
            npx playwright install --with-deps chromium webkit
          else
            npx playwright install-deps chromium webkit
          fi

      - name: Run frontend browser regression
        working-directory: front
        env:
          PLAYWRIGHT_INCLUDE_WEBKIT: "1"
        run: npm run test:browser

      - name: Upload Playwright failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-playwright-diagnostics
          path: |
            front/test-results/
            front/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Run frontend audit
        working-directory: front
        run: npm audit --audit-level=high

  desktop-cross-os:
    name: Desktop & Cross-OS Gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-15]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux desktop dependencies
        if: matrix.os == 'ubuntu-22.04'
        uses: ./.github/actions/install-linux-deps

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Install frontend dependencies
        shell: bash
        run: npm --prefix front ci

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: front/src-tauri
          key: ci-desktop-${{ matrix.os }}

      - name: Check Rust formatting
        shell: bash
        run: cargo fmt --manifest-path front/src-tauri/Cargo.toml -- --check

      - name: Run Rust Clippy
        shell: bash
        run: cargo clippy --manifest-path front/src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Run Rust unit tests
        shell: bash
        run: cargo test --manifest-path front/src-tauri/Cargo.toml

      - name: Run frontend node tests on OS
        shell: bash
        run: npm --prefix front run test:node

      - name: Run CI gate and release asset tests on OS
        shell: bash
        run: node --test tools/ci/resolve-ci-gates.test.mjs tools/release/release-assets.test.mjs

      - name: Build desktop static export on OS
        shell: bash
        run: npm --prefix front run build:desktop

  smoke:
    name: Smoke Definition Gate
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.smoke == 'true'
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validate service journey smoke definition
        run: node tools/perf/validate-k6-smoke.mjs

  workflow-contract:
    name: Workflow Contract Gate
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.workflow == 'true'
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Run repository hygiene guard
        run: node tools/ci/check-repo-hygiene.mjs

      - name: Validate CI gate resolver
        run: node --test tools/ci/resolve-ci-gates.test.mjs

      - name: Validate desktop release asset contract
        run: node --test tools/release/release-assets.test.mjs

      - name: Validate staging CD workflow contract
        run: bash tools/test/check-staging-cd-contract.sh

  infra:
    name: Terraform Infra Gate
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra/terraform/oci/always-free-a1-flex

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.5"

      - name: Check Terraform format
        run: terraform fmt -check

      - name: Initialize Terraform without backend
        run: terraform init -backend=false

      - name: Validate Terraform
        run: terraform validate
