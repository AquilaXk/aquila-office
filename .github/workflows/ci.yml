name: CI

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/ci.yml"
      - ".github/workflows/backend-cd.yml"
      - "back/**"
      - "docker/**"
      - "front/**"
      - "perf/**"
      - "scripts/deploy/**"
      - "tools/perf/**"
      - "tools/test/run-k6-smoke.sh"
      - "README.md"
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/ci.yml"
      - ".github/workflows/backend-cd.yml"
      - "back/**"
      - "docker/**"
      - "front/**"
      - "perf/**"
      - "scripts/deploy/**"
      - "tools/perf/**"
      - "tools/test/run-k6-smoke.sh"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Grant Gradle wrapper permission
        run: chmod +x back/gradlew

      - name: Run backend quality gate
        run: ./back/gradlew -p back check

      - name: Upload backend check reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-check-reports
          path: |
            back/build/reports/tests/test/
            back/build/reports/checkstyle/
            back/build/reports/spotbugs/
            back/build/reports/jacoco/test/
            back/build/reports/problems/
          if-no-files-found: ignore
          retention-days: 14

  frontend:
    name: Frontend Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Install dependencies
        working-directory: front
        run: npm ci

      - name: Run frontend lint
        working-directory: front
        run: npm run lint

      - name: Run frontend build
        working-directory: front
        run: npm run build

      - name: Run frontend audit
        working-directory: front
        run: npm audit --audit-level=moderate
