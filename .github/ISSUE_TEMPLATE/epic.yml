name: "Epic (로드맵 에픽)"
description: "도메인 영역의 로드맵 목표와 수직 슬라이스 작업 단위를 정의하는 상위 에픽입니다."
title: "[Epic] "
labels: ["type:epic"]
body:
  - type: textarea
    id: goal
    attributes:
      label: "배경 및 목표"
      description: "에픽이 해결하려는 핵심 문제와 달성 목표를 기술합니다."
    validations:
      required: true
  - type: textarea
    id: slices
    attributes:
      label: "수직 슬라이스 작업 항목"
      description: "완결된 기능 단위(Sub-issue 또는 Batch PR) 체크리스트를 작성합니다."
      placeholder: |
        - [ ] 슬라이스 1
        - [ ] 슬라이스 2
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: "인수 기준"
      description: "에픽 완료를 판단하는 결정론적 검증 기준을 명시합니다."
    validations:
      required: true
