spring:
  application:
    name: aquila-office-back

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

custom:
  cors:
    allowed-origin-patterns:
      - http://localhost:3000
      - http://localhost:5173

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
